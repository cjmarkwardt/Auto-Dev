name: Release

# Pushing a version tag (e.g. "1.2.0", matching this repo's existing bare-semver tag convention - no "v"
# prefix) is the whole release trigger: it builds self-contained single-file win-x64/linux-x64 binaries (see
# Client/AutoDev.csproj's RuntimeIdentifiers/PublishSingleFile), then creates the GitHub Release for that tag
# and attaches both as assets - no separate "draft a release first" step needed.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test AutoDev.slnx -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # dotnet publish can cross-compile a self-contained win-x64 build from this Linux runner just as well as
      # linux-x64 - Avalonia has no Windows-only/WPF runtime dependency, so no Windows runner is needed for
      # either platform.
      - name: Publish win-x64
        run: dotnet publish Client/AutoDev.csproj -c Release -r win-x64 -o publish/win-x64

      - name: Publish linux-x64
        run: dotnet publish Client/AutoDev.csproj -c Release -r linux-x64 -o publish/linux-x64

      # zip for Windows, tar.gz for Linux - the conventional archive per platform. tar.gz also preserves the
      # executable bit on extraction, which a raw uploaded binary or a zip cannot guarantee.
      - name: Package win-x64
        run: (cd publish/win-x64 && zip -r "$GITHUB_WORKSPACE/AutoDev-${{ github.ref_name }}-win-x64.zip" .)

      - name: Package linux-x64
        run: |
          chmod +x publish/linux-x64/AutoDev
          tar -czf "AutoDev-${{ github.ref_name }}-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "AutoDev-${{ github.ref_name }}-win-x64.zip" \
            "AutoDev-${{ github.ref_name }}-linux-x64.tar.gz" \
            --title "${{ github.ref_name }}" \
            --generate-notes
